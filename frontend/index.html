<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Wonder</title>
</head>
<body>
    <div class="header">
        <h1>Wonder</h1>
        <div class="header-buttons">
            <button id="settingsBtn">Settings</button>
        </div>
    </div>
    <div class="main">
        <h2>Paste your own story</h2>
        <textarea id="story-input" placeholder="Paste your story here..."></textarea>
        <button id="openStoryBtn">Open Story</button>
        <button>Upload file</button>
    </div>
    <div class="footer"></div>

    <!-- Settings popup -->
    <div id="settingsOverlay" class="overlay hidden">
        <div class="modal">
            <h2>Settings</h2>
            <p>Appearance</p>
            <div class="theme-options">
                <button class="theme-btn" data-theme="dark">Dark mode</button>
                <button class="theme-btn" data-theme="light">Light mode</button>
            </div>
            <button id="closeSettingsBtn" class="close-btn">Close</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
