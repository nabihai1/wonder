<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wonder</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <h1>Wonder</h1>
        <div class="header-buttons">
            <div class="settings-wrapper">
                <button id="settingsBtn">Settings</button>
            </div>
        </div>
    </div>
    <div class="main">
        <h2>Paste your own story</h2>
        <input id="storyInput">
        <button id="makePagesBtn">Make pages</button>
    </div>
    <div class="footer"></div>
    <div id="settingsOverlay" class="overlay hidden">
        <div class="modal">
            <h2>Settings</h2>
            <p>Appearance</p>
            <div class="theme-options">
                <button class="theme-btn" data-theme="dark">Dark mode</button>
                <button class="theme-btn" data-theme="light">Light mode</button>
            </div>
            <button id="closeSettingsBtn" class="close-btn">Close</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
