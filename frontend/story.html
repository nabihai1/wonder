<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Story</title>
</head>
<body>
    <div class="header">
        <button onclick="goBack()">Library</button>
        <h1>Story Name</h1>
        <button>Bigger</button>
        <button>Smaller</button>
        <button onclick="readStory()">Chesire Cat Reads</button>
        <button onclick="stopReading()">Stop</button>
    </div>
    <div class="main">
        <p>Text</p>
    </div>
    <footer class="footer">
        <button>Back</button>
        <div class="page-indicator">
            <p>Page 1 of 1</p>
            <button></button>
            <button>Next</button>
        </div>
    </footer>
    <title>Wonder - Story</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <h1>Wonder</h1>
        <div class="header-buttons">
            <button id="backBtn">Back</button> 
            <div class="settings-wrapper">
                <button id="settingsBtn">Settings</button>
            </div>
        </div>
    </div>
    <div class="main">
        <h2>Your story</h2>
        <p id="storyText"></p>
    </div>
    <div class="footer"></div>

    <script src="app.js"></script>
</body>
</html>
