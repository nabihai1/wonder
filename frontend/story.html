<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Wonder - Story</title>
</head>
<body>
    <div class="header">
        <button id="mainBtn">Main Menu</button>
        <h1>Wonder</h1>
        <button id="biggerBtn">Bigger</button>
        <button id="smallerBtn">Smaller</button>
        <button>Cheshire Cat Reads</button>
        <button id="settingsBtn">Settings</button>
    </div>
    <div class="main">
        <p id="storyText">Text</p>
    </div>
    <footer class="footer">
        <button id="backBtn">Back</button>
        <div class="page-indicator">
            <p>Page 1 of 1</p>
            <button></button>
            <button>Next</button>
        </div>
    </footer>

    <!-- Settings popup -->
    <div id="settingsOverlay" class="overlay hidden">
        <div class="modal">
            <h2>Settings</h2>
            <p>Appearance</p>
            <div class="theme-options">
                <button class="theme-btn" data-theme="dark">Dark mode</button>
                <button class="theme-btn" data-theme="light">Light mode</button>
            </div>
            <button id="closeSettingsBtn" class="close-btn">Close</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
