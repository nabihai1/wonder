<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alice&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/opendyslexic" rel="stylesheet">
    <title>Wonder - Story</title>
</head>
<body>
    <div class="header">
        <button id="mainBtn">Main Menu</button>
        <h1>Wonder</h1>
        <div class="header-buttons">
            <button id="settingsBtn">Settings</button>
        </div>
    </div>

    <div class="main">
        <div class="story-wrap">
            <p id="story-display"></p>
            <div class="text-controls">
                <button id="catBtn">Cheshire Cat Reads</button>
                <button id="smallerBtn" aria-label="Smaller text">Smaller</button>
                <button id="biggerBtn" aria-label="Bigger text">Bigger</button>
            </div>
        </div>
    </div>

    <footer class="footer">
        <button id="backBtn">Back</button>
        <p id="page-indicator">Page 1 of 1</p>
        <button id="nextBtn">Next</button>
        <button id="saveStoryBtn"> Save & Leave 🍪</button>
        <button id="finishStoryBtn" style="display: none;">Finish Story 🎉</button>
    </footer>

    <!-- Settings popup -->
    <div id="settingsOverlay" class="overlay hidden">
        <div class="modal">
            <h2>Settings</h2>
            <p>Appearance</p>
            <div class="theme-options">
                <button class="theme-btn" data-theme="dark">Dark mode</button>
                <button class="theme-btn" data-theme="light">Light mode</button>
            </div>
            <p>Reading speed</p>
            <div class="theme-options">
                <button class="speed-btn" data-rate="0.7">Slow</button>
                <button class="speed-btn" data-rate="0.95">Normal</button>
                <button class="speed-btn" data-rate="1.3">Fast</button>
            </div>
            <p>Reading Assistants</p>
            <div class="assist-options">
                <button id="pictureToggleBtn" class="assist-btn">Picture Words</button>
                <button id="letterToggleBtn" class="assist-btn">Letter Colors</button>
                <button id="fontToggleBtn" class="assist-btn">Dyslexia Font</button>
            </div>
            <button id="closeSettingsBtn" class="close-btn">Close</button>
        </div>
    </div>

    <!--Rewards System celebration popup -->
    <div id="rewardsOverlay" class="overlay hidden">
        <div class="modal reward-modal">
            <h2 id="rewardTitle">Congratulations! 🎉</h2>
            <p id="rewardMessage"></p>
            <button id="closeRewardBtn">Continue</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
